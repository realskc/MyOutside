<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>加入 · MyOutside</title>
    <link rel="stylesheet" href="/__myoutside/static/auth.css" />
  </head>
  <body>
    <main class="auth">
      <h1>MyOutside</h1>
      <p class="lead">你被邀请来试用。起个用户名、设个密码就能开始</p>
      <form id="form">
        <label>用户名（字母、数字或 _ . -，最多 32 个）<input name="username" autocomplete="username" maxlength="32" required autofocus /></label>
        <label>密码（至少 8 个字符）<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required /></label>
        <label>再输一遍<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required /></label>
        <button id="submit" type="submit">注册并登录</button>
        <p id="message" class="message" role="alert"></p>
      </form>
    </main>
    <script src="/__myoutside/static/join.js"></script>
  </body>
</html>
