<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · MyOutside</title>
    <link rel="stylesheet" href="/__myoutside/static/auth.css" />
  </head>
  <body>
    <main class="auth">
      <h1>MyOutside</h1>
      <form id="form">
        <label>用户名<input name="username" autocomplete="username" maxlength="32" required autofocus /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" maxlength="256" required /></label>
        <button id="submit" type="submit">登录</button>
        <p id="message" class="message" role="alert"></p>
      </form>
    </main>
    <script src="/__myoutside/static/login.js"></script>
  </body>
</html>
